name: Zero Plugin
on:
  pull_request:
    paths:
      - "zero/plugin/**"
      - ".github/workflows/zero-plugin.yaml"
  push:
    branches:
      - main
    paths:
      - "zero/plugin/**"
      - ".github/workflows/zero-plugin.yaml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: zero/plugin/.tool-versions
          cache: npm
          cache-dependency-path: zero/plugin/tools/package-lock.json
      - name: Build and validate
        run: make zero-plugin
      # Download this artifact for the OpenAI upload; zero/plugin/README.md has
      # the submission steps. Not a GitHub release: helm.yaml publishes the
      # Helm chart on every release.
      - name: Upload bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zero-plugin
          path: zero/plugin/dist/
          if-no-files-found: error
